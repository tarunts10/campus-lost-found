<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Campus Lost & Found — a private lost-and-found platform for verified college members."
    />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Preconnect before the stylesheet so the font handshake starts early. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text y='.9em' x='50%25' text-anchor='middle' font-size='58' font-family='system-ui' font-weight='bold' fill='white'>CL</text></svg>"
    />

    <title>Campus Lost &amp; Found</title>
  </head>
  <body>
    <!--
      THEME BOOTSTRAP — runs BEFORE React mounts and before first paint.

      Without this the page renders with the light default, React then
      mounts, reads localStorage and switches to dark: a visible white
      flash on every load. This is deliberately a blocking inline script
      (no defer, no module) so it executes before the browser paints.

      Kept tiny and duplicated from ThemeContext on purpose — importing a
      module here would defer it and reintroduce the flash.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('clf_theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
          // 'system' or unset: leave the attribute off so the
          // prefers-color-scheme media query decides.
        } catch (e) {
          /* storage blocked - fall through to the OS preference */
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
